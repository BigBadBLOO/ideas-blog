name: Publish Telegram posts

on:
  schedule:
    - cron: '5 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/telegram.mjs publish 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@kvestovichok'
      - name: Save queue
        run: |
          git config user.name "telegram-bot"
          git config user.email "telegram-bot@users.noreply.github.com"
          git add content-src/telegram/posts.json
          git diff --cached --quiet || (git commit -m "chore: publish telegram post" && git push)
